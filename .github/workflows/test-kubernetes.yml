name: Kubernetes & Argo Tests

on:
  push:
    branches: [1b,main]
  pull_request:
    branches: [main]

jobs:
  test-k8s-argo:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out QA tests
        uses: actions/checkout@v4
        with:
          path: qa-tests

      - name: Check out Metaflow
        uses: actions/checkout@v4
        with:
          repository: Netflix/metaflow
          path: metaflow-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Metaflow Dev Stack & Tox
        run: |
          python -m pip install --upgrade pip
          pip install ./metaflow-src kubernetes tox

      - name: Start Dev Stack
        working-directory: ./metaflow-src
        run: |
          echo "Starting Metaflow dev stack in the background..."
          MINIKUBE_CPUS=2 metaflow-dev all-up &
          WAIT_TIMEOUT=600 metaflow-dev wait-until-ready

      - name: Run Tox Environments (Kubernetes and Argo)
        working-directory: ./qa-tests
        run: |
          # The Host (Pytest) must use localhost, as Metaflow's Tilt stack proxies
          # these ports seamlessly to the Host machine.
          # Note: The Metaflow Kubernetes decorator handles internal routing for the Pod automatically.
          # --junitxml writes to qa-tests/test-results/ which is on the host filesystem,
          # not inside the container, so results are accessible after the shell exits.
          cat <<'EOF' | metaflow-dev shell
          export METAFLOW_SERVICE_URL=http://localhost:8080

          # Crucial resource limits to fit Pod inside 2 CPU GH Actions runner
          export METAFLOW_KUBERNETES_MEMORY=1024
          export METAFLOW_KUBERNETES_CPU=0.5

          echo "--- Starting Kubernetes Suite ---"
          tox -e kubernetes -- -v -s

          echo "--- Starting Argo Workflows Suite ---"
          tox -e argo -- -v -s
          EOF

      - name: Teardown Dev Stack
        if: always()
        working-directory: ./metaflow-src
        run: metaflow-dev down

      - name: Generate unified test report
        if: always()
        working-directory: ./qa-tests
        run: |
          python scripts/merge_results.py \
            --results-dir test-results \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --html test-results/report.html || true
          # '|| true' prevents this step from masking original test failures

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-k8s-argo
          path: qa-tests/test-results/report.html
          if-no-files-found: warn

