[tox]
envlist = local, kubernetes, argo
isolated_build = True

[testenv]
passenv =
    METAFLOW_*
    AWS_*
    HOME
    USER

[testenv:local]
commands = pytest --pyargs metaflow_qa_tests.basic -v --junitxml=test-results/local.xml {posargs}

[testenv:kubernetes]
deps = kubernetes
commands = pytest --pyargs metaflow_qa_tests.kubernetes -v --junitxml=test-results/kubernetes.xml {posargs}

[testenv:argo]
deps = kubernetes
commands = pytest --pyargs metaflow_qa_tests.argo_workflows -v --junitxml=test-results/argo.xml {posargs}

[testenv:all]
deps = kubernetes
commands =
    pytest --pyargs metaflow_qa_tests.basic -v --junitxml=test-results/local.xml {posargs}
    pytest --pyargs metaflow_qa_tests.kubernetes -v --junitxml=test-results/kubernetes.xml {posargs}
    pytest --pyargs metaflow_qa_tests.argo_workflows -v --junitxml=test-results/argo.xml {posargs}

[testenv:report]
skip_install = True
deps =
commands = python scripts/merge_results.py {posargs}