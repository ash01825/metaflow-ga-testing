[tox]
envlist = local, kubernetes, argo
isolated_build = True

[testenv]
# We use globbing (METAFLOW_* and AWS_*) because there are many dynamic variables
# like METAFLOW_S3_ENDPOINT_URL (crucial for our S3 minio fix) that need to pass
# from the metaflow-dev shell to the test environment.
passenv =
    METAFLOW_*
    AWS_*
    HOME
    USER

[testenv:local]
# Local backend tests require no external deps
commands = pytest -m local --pyargs metaflow_qa_tests -v {posargs}

[testenv:kubernetes]
deps = kubernetes
commands = pytest -m kubernetes --pyargs metaflow_qa_tests -v {posargs}

[testenv:argo]
deps = kubernetes
commands = pytest -m argo_workflows --pyargs metaflow_qa_tests -v {posargs}

[testenv:all]
# Run all environments sequentially for true per-backend isolation
deps = kubernetes
commands =
    pytest -m local --pyargs metaflow_qa_tests -v {posargs}
    pytest -m kubernetes --pyargs metaflow_qa_tests -v {posargs}
    pytest -m argo_workflows --pyargs metaflow_qa_tests -v {posargs}